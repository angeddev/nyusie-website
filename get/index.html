<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Nyusie</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D0C2B">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0D0C2B;color:#F6F3EC;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  a{color:#FFC21A}
  .w{padding:24px}
  .b{display:inline-block;margin:8px;padding:12px 18px;border-radius:12px;background:#16153d;border:1px solid #2a2860;color:#F6F3EC;text-decoration:none;font-weight:600}
</style>
<!-- Store links and the launch time come from the website's settings file,
     so this page never needs editing: before launch (or if a store link is
     empty) everyone goes to nyusie.com; after launch, iPhones go to the
     App Store and Android phones to Google Play. Test early with ?preview=live -->
<script src="/assets/js/config.js"></script>
<script>
(function(){
  var c = window.NYUSIE_CONFIG || {};
  var live = Date.now() >= Date.parse(c.launchAt || "2100-01-01T00:00:00Z") || /[?&]preview=live/.test(location.search);
  var APP_STORE  = live ? (c.appStoreUrl  || "") : "";
  var PLAY_STORE = live ? (c.playStoreUrl || "") : "";
  var WEBSITE    = live ? "https://nyusie.com/#get" : "https://nyusie.com/";
  var ua = navigator.userAgent || "";
  var iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  location.replace((iOS && APP_STORE) || (android && PLAY_STORE) || WEBSITE);
})();
</script>
</head><body><div class="w">
  <p>Taking you to Nyusie…</p>
  <p><a class="b" href="https://nyusie.com">nyusie.com</a></p>
</div></body></html>
